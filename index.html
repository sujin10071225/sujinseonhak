<!DOCTYPE html>

<head>

  <style>
    * {
      margin: 0;

      box-sizing: border-box;

    body {
      font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
      color: #222;
      background: #fff;
      line-height: 1.7;
    }

    header {
      background: rgba(255,255,255,0.96);
      padding: 18px 7%;

      align-items: center;
      border-bottom: 1px solid #eee;
    }

    .logo {

    }

    .logo span {
      display: block;

      color: #777;
    }

    nav a {
      color: #333;
      text-decoration: none;
      margin-left: 25px;
      font-size: 14px;
    }

    .hero {
      min-height: 78vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 20px;
      background:
        linear-gradient(
          rgba(4,18,32,0.78),
          rgba(8,35,48,0.70)
        ),
        linear-gradient(135deg,#17384a,#426b73);
      color: white;
    }

    .hero-inner {
      max-width: 850px;
    }

    .hero-small {
      letter-spacing: 5px;
      font-size: 14px;
      margin-bottom: 25px;
      opacity: .85;
    }

    h1 {
      font-size: clamp(38px,7vw,72px);
      font-weight: 500;
      letter-spacing: 5px;
      margin-bottom: 22px;
    }

    .hero h2 {
      font-size: clamp(20px,3vw,30px);
      font-weight: 400;
      margin-bottom: 25px;
    }

    .hero p {
      max-width: 650px;
      margin: auto;
      color: rgba(255,255,255,.85);
      font-size: 16px;
    }

    .button {
      display: inline-block;
      margin-top: 38px;
      padding: 13px 32px;
      border: 1px solid rgba(255,255,255,.8);
      color: white;
      text-decoration: none;
      border-radius: 30px;
    }

    .intro {
      padding: 90px 20px;
      text-align: center;
    }

    .intro h2 {
      font-size: 31px;
      margin-bottom: 25px;
      font-weight: 500;
    }

    .intro p {
      max-width: 700px;
      margin: auto;
      color: #666;
    }

    .programs {
      padding: 70px 7% 100px;
      background: #f5f6f4;
    }

    .programs h2 {
      text-align: center;
      margin-bottom: 45px;
      font-size: 30px;
      font-weight: 500;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 25px;
      max-width: 1100px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 45px 30px;
      text-align: center;
      border-radius: 4px;
    }

    .card h3 {
      margin-bottom: 15px;
      font-size: 20px;
    }

    .card p {
      font-size: 14px;
      color: #777;
    }

    footer {
      padding: 45px 20px;
      text-align: center;
      background: #17242a;
      color: #aaa;
      font-size: 13px;
    }

    @media(max-width:700px) {
      header {
        display:block;
        text-align:center;
      }

      nav {
        margin-top:12px;
      }

      nav a {
        margin:0 7px;
        font-size:12px;
      }

      .cards {
        grid-template-columns:1fr;
      }

      .hero {
        min-height:70vh;
      }
    }

</head>
